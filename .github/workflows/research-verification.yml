name: Research verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corenews_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: corenews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corenews_test -d corenews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify SQLite routes and fixtures
        run: python -m unittest discover -s tests -v
      - name: Verify PostgreSQL storage and workspace boundaries
        env:
          CORENEWS_TEST_DATABASE_URL: postgresql://corenews_test:fixture-only@127.0.0.1:5432/corenews_test
        run: python -m unittest discover -s tests -v
