<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research · CoreNews</title>
  <link rel="stylesheet" href="./assets/research.css">
  <script src="./assets/research.js" defer></script>
</head>
<body>
  <header>
    <div class="wrap masthead">
      <img src="./assets/corenews.svg" alt="CoreNews" width="136" height="26">
      <span>Follow the evidence.</span>
    </div>
  </header>
  <main>
    <section class="search-section" aria-labelledby="research-title">
      <div class="wrap">
        <h1 id="research-title">Research</h1>
        <p>Find certificate records and company filings. Trace each record to its source.</p>
        <form id="search-form" action="./" method="get">
          <label for="source-mode">Source</label>
          <select id="source-mode" name="source">
            <option value="crtsh">Domain certificates · crt.sh</option>
            <option value="edgar">Company filings · SEC EDGAR</option>
          </select>
          <label for="domain" id="query-label">Domain</label>
          <div class="search-controls">
            <input id="domain" name="q" type="search" required maxlength="253"
              placeholder="example.org" spellcheck="false" autocapitalize="none" autocomplete="off">
            <button class="primary" type="submit">Search</button>
          </div>
        </form>
        <section class="case-tools" aria-labelledby="workspace-title">
          <h2 id="workspace-title">Case workspace</h2>
          <form id="workspace-form">
            <label for="workspace-key">Workspace key</label>
            <div class="search-controls">
              <input id="workspace-key" type="password" required maxlength="512" autocomplete="off">
              <button class="secondary" type="submit">Open workspace</button>
            </div>
          </form>
          <div id="case-controls" hidden>
            <form id="new-case">
              <label for="case-title">New case name</label>
              <div class="search-controls">
                <input id="case-title" required maxlength="160">
                <button class="secondary" type="submit">Create case</button>
              </div>
            </form>
            <label for="active-case">Active case</label>
            <div class="case-actions">
              <select id="active-case"></select>
              <button class="secondary" id="view-case" type="button" disabled>View saved evidence</button>
              <button class="secondary" id="close-workspace" type="button">Close workspace</button>
            </div>
          </div>
          <p id="workspace-status" role="status"></p>
        </section>
      </div>
    </section>
    <div class="wrap workspace">
      <section class="listing" aria-labelledby="results-title">
        <div class="results-header">
          <h2 id="results-title">Search results</h2>
          <p id="status" role="status"></p>
        </div>
        <div id="error" class="notice" hidden>
          <p id="error-message" role="alert"></p>
          <button id="retry" class="secondary" type="button" hidden>Retry search</button>
        </div>
        <div id="results" aria-busy="false">
          <p id="empty" class="empty">Enter a domain to look up its certificate records.</p>
          <ul id="records"></ul>
        </div>
      </section>
      <aside id="detail" aria-labelledby="detail-title" hidden>
        <div class="detail-header">
          <span id="record-kind">Record</span>
          <button id="back" class="secondary" type="button">Back to results</button>
        </div>
        <h2 id="detail-title" tabindex="-1"></h2>
        <p id="attribution"></p>
        <a id="original" class="original" target="_blank" rel="noopener noreferrer">View original record</a>
        <dl id="provenance"></dl>
        <h3>What this record shows</h3>
        <p id="record-shows"></p>
        <ul id="names" aria-label="Names on the certificate"></ul>
        <h3>What remains open</h3>
        <p id="record-limits"></p>
        <div class="case-actions">
          <button class="secondary" id="copy-citation" type="button">Copy citation</button>
          <button class="primary" id="save-record" type="button" hidden>Save to case</button>
          <button class="secondary" id="verify-record" type="button" hidden>Verify snapshot</button>
        </div>
        <p id="record-status" role="status"></p>
        <textarea id="citation-text" aria-label="Citation text" rows="4" readonly hidden></textarea>
      </aside>
    </div>
    <noscript><p class="wrap">Enable JavaScript to search certificate records.</p></noscript>
  </main>
</body>
</html>
