version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corenews
      POSTGRES_USER: corenews
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  watch-worker:
    profiles: ["monitoring"]
    build: ./backend
    command: ["python", "-m", "app.watch_worker"]
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
