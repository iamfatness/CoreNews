version: '3.8'

services:
  # Placeholder services for CoreNews OSINT platform
  # To be expanded as connectors and core services are implemented

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corenews
      POSTGRES_USER: corenews
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

